name: AstraWin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build native core
        run: cmake --build build --parallel 2

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

  android-apk:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contains only the ARM64 native library
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" > apk-files.txt
          grep -qx "lib/arm64-v8a/libastrawin_native.so" apk-files.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' apk-files.txt; then
            echo "Unexpected non-ARM64 native library found in APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: astrawin-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
